[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wl-contract"
version = "1.0.0"
description = "Offline structural revision review for Wayland protocol maintainers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "waxwingfactor"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
wl-contract = "wl_contract.__main__:main"

[project.urls]
Repository = "https://github.com/waxwingfactor/wl-contract"
Issues = "https://github.com/waxwingfactor/wl-contract/issues"

[tool.setuptools.packages.find]
where = ["src"]
