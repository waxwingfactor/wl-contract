name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python tests/install_wheel.py
      - run: python -m unittest discover -s tests -v
        env:
          WL_CONTRACT_TEST_INSTALLED: '1'
          PYTHONNOUSERSITE: '1'
      - run: python tests/check_distribution.py
  gate:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every installation and acceptance check
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
